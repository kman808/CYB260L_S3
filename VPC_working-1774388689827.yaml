AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation Template to create a VPC spanning 3 Availability Zones
  in the US-West-2 region.
  VPC Name Format: VPC-keymet5066

# ============================================================
# PARAMETERS
# ============================================================
Parameters:
  StudentID:
    Type: String
    Default: keymet5066
    Description: Student ID used for naming the VPC

# ============================================================
# MAPPINGS (OPTIONAL - REGION SPECIFIC CONFIG)
# ============================================================
Mappings:
  RegionMap:
    us-west-2:
      CIDR: 10.0.0.0/16

# ============================================================
# RESOURCES
# ============================================================
Resources:

  # ------------------------------------------------------------
  # VPC CREATION
  # ------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      # CIDR block defines IP range for the VPC
      CidrBlock: !FindInMap [RegionMap, us-west-2, CIDR]

      # Enable DNS for internal name resolution
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub VPC-${StudentID}

  # ------------------------------------------------------------
  # SUBNETS ACROSS 3 AVAILABILITY ZONES (HIGH AVAILABILITY)
  # ------------------------------------------------------------

  SubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-west-2a
      Tags:
        - Key: Name
          Value: !Sub VPC-${StudentID}-Subnet-AZ1

  SubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-west-2b
      Tags:
        - Key: Name
          Value: !Sub VPC-${StudentID}-Subnet-AZ2

  SubnetAZ3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: us-west-2c
      Tags:
        - Key: Name
          Value: !Sub VPC-${StudentID}-Subnet-AZ3

# ============================================================
# OUTPUTS (USEFUL AFTER STACK CREATION)
# ============================================================
Outputs:

  VPCId:
    Description: The ID of the created VPC
    Value: !Ref VPC

  VPCName:
    Description: The Name tag of the VPC
    Value: !Sub VPC-${StudentID}

  SubnetAZ1:
    Description: Subnet in AZ1
    Value: !Ref SubnetAZ1

  SubnetAZ2:
    Description: Subnet in AZ2
    Value: !Ref SubnetAZ2

  SubnetAZ3:
    Description: Subnet in AZ3
    Value: !Ref SubnetAZ3